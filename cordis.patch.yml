# dsh-util-plugs — one bundle, eleven switchable rows
#
# Self-contained: all eleven runtime modules live inside this package under
# plugins/ and vendor/. No unpublished npm package, workspace resolution or
# network registry is required at install time.
- insert:
    - id: context-sentinel
      name: dsh-util-plugs/plugins/context-sentinel
      config:
        contextMeter:
          notifyPercent: 78
          rearmPercent: 68
        teamHooks2:
          enabled: true
    - id: message-bus
      name: dsh-util-plugs/plugins/message-bus
      config:
        strictMode: true
    - id: bulletin-board
      name: dsh-util-plugs/plugins/bulletin-board
    - id: agent-apartment
      name: dsh-util-plugs/plugins/agent-apartment
    - id: agent-memory
      name: dsh-util-plugs/plugins/agent-memory
    - id: local-worker
      name: dsh-util-plugs/plugins/local-worker
      config:
        mode: dsh-provider
        endpoint: http://127.0.0.1:11435/v1
        model: qwen2.5-coder:0.5b
    - id: team-bus
      name: dsh-util-plugs/plugins/team-bus
    - id: agent-workflows
      name: dsh-util-plugs/plugins/agent-workflows
    - id: workbench-bundle
      name: dsh-util-plugs
    - id: auto-backup
      name: dsh-util-plugs/plugins/auto-backup
      config:
        enabled: true
        backupDir: file_backups
    - id: host-relaunch
      name: dsh-util-plugs/plugins/host-relaunch
      config:
        enabled: true
        allowRealRestart: false
    - id: plugin-console
      name: dsh-util-plugs/plugins/plugin-console
